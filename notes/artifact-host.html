<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' blob: https://cdn.jsdelivr.net https://esm.sh; style-src 'unsafe-inline' https://cdn.jsdelivr.net https://esm.sh; img-src * data: blob:; font-src https: data:; connect-src https://esm.sh https://cdn.jsdelivr.net;" />
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
    #root { padding: 12px; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    .artifact-error { font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #b00020;
      background: #fff0f1; border: 1px solid #f3c2c7; border-radius: 8px; padding: 12px 14px; white-space: pre-wrap; }
    html.dark-mode .artifact-error { color: #ff9aa2; background: #2a1416; border-color: #5a2a2f; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    (function () {
      "use strict";
      var REACT = "https://esm.sh/react@18.3.1";
      var REACTDOM = "https://esm.sh/react-dom@18.3.1?external=react";
      var REACTDOM_CLIENT = "https://esm.sh/react-dom@18.3.1/client?external=react";
      var frameId = null, started = false;

      function post(msg) { msg.source = "artifact"; msg.id = frameId; parent.postMessage(msg, "*"); }
      function reportHeight() {
        var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
        post({ type: "artifact:height", px: h });
      }
      function showError(message) {
        var root = document.getElementById("root");
        root.innerHTML = "";
        var card = document.createElement("div");
        card.className = "artifact-error";
        card.textContent = "Artifact error:\n" + message;
        root.appendChild(card);
        reportHeight();
        post({ type: "artifact:error", message: String(message) });
      }
      function applyTheme(theme) {
        document.documentElement.classList.toggle("dark-mode", theme === "dark");
        window.__theme = theme;
        window.dispatchEvent(new CustomEvent("themechange", { detail: theme }));
      }
      function injectStyles(layers) {
        (layers || []).forEach(function (css) {
          if (!css) return;
          var s = document.createElement("style"); s.textContent = css; document.head.appendChild(s);
        });
      }
      var BABEL_URL = "https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js";
      var babelReady = null;
      function loadBabel() {            // only fetched/parsed when raw JSX needs transforming
        if (babelReady) return babelReady;
        babelReady = new Promise(function (resolve, reject) {
          var s = document.createElement("script");
          s.src = BABEL_URL;
          s.onload = resolve;
          s.onerror = function () { reject(new Error("failed to load Babel")); };
          document.head.appendChild(s);
        });
        return babelReady;
      }
      function transform(src) {
        return Babel.transform(src, { presets: ["react"], sourceType: "module", filename: "artifact.jsx" }).code;
      }
      function maybeTransform(src, precompiled) { return precompiled ? src : transform(src); }
      function blobUrl(code) { return URL.createObjectURL(new Blob([code], { type: "text/javascript" })); }

      // MathJax is opt-in per artifact (payload.math), never loaded otherwise:
      // 173 artifacts share this host and only one needs a math engine. The config
      // comes from the parent page (note.js fetched /js/mathjax.js with the same
      // macros/delimiters as the note page), so they stay in sync. We eval the
      // config first, then load the CDN bundle — MathJax reads window.MathJax at
      // load time. If the config is missing or eval throws, or the CDN fails to
      // load, the artifact still mounts and renders with raw math notation. This
      // makes failure non-fatal: a broken math setup does not break the whole demo.
      var MATHJAX_CDN_URL = "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js";
      var mathJaxReady = null;
      function loadMathJax(mathConfig) {
        if (mathJaxReady) return mathJaxReady;
        mathJaxReady = new Promise(function (resolve) {
          try {
            if (!mathConfig) { resolve(); return; }
            (0, eval)(mathConfig);   // sets window.MathJax; must run before the CDN bundle loads
          } catch (err) {
            console.error("MathJax config eval failed:", err);
            resolve();   // non-fatal: continue without typeset math
            return;
          }
          var s = document.createElement("script");
          s.src = MATHJAX_CDN_URL;
          s.onload = resolve;
          s.onerror = function (err) {
            console.error("MathJax CDN failed:", err);
            resolve();   // non-fatal: continue without typeset math
          };
          document.head.appendChild(s);
        });
        return mathJaxReady;
      }

      function buildImportMap(payload) {
        var imports = { "react": REACT, "react-dom": REACTDOM, "react-dom/client": REACTDOM_CLIENT };
        var modules = payload.modules || {};
        Object.keys(modules).forEach(function (spec) { imports[spec] = blobUrl(maybeTransform(modules[spec], payload.precompiled)); });
        var libs = payload.libImports || {};
        Object.keys(libs).forEach(function (spec) { if (!imports[spec]) imports[spec] = libs[spec]; });
        return { imports: imports };
      }
      function injectImportMap(map) {
        var s = document.createElement("script"); s.type = "importmap";
        s.textContent = JSON.stringify(map); document.head.appendChild(s);
      }

      async function mount(payload) {
        if (started) return; started = true;
        try {
          applyTheme(payload.theme);
          injectStyles(payload.css);
          if (!payload.precompiled) await loadBabel();   // raw JSX needs Babel; precompiled skips it
          if (payload.math) await loadMathJax(payload.mathConfig);   // opt-in only; flagless artifacts never hit this
          injectImportMap(buildImportMap(payload));   // must precede any module import

          var ReactNS = await import("react");
          window.React = ReactNS.default || ReactNS;   // one instance; also usable as global
          var clientNS = await import("react-dom/client");

          var mod = await import(blobUrl(maybeTransform(payload.code, payload.precompiled)));
          var Comp = mod.default;
          if (!Comp) throw new Error("Artifact has no default export / App component.");

          clientNS.createRoot(document.getElementById("root")).render(window.React.createElement(Comp));

          requestAnimationFrame(function () {
            // hand the note the artifact's own title so its collapsible bar can show it
            var tEl = document.querySelector("[data-artifact-title]");
            var title = tEl ? (tEl.textContent || "").trim() : "";
            if (payload.math) {
              // Exposed only for math artifacts — a flagless demo has no global
              // to call. Safe no-op if MathJax failed to load or isn't ready yet.
              window.typesetMath = function () {
                if (window.MathJax && window.MathJax.typesetPromise) {
                  window.MathJax.typesetPromise().catch(function () {});
                }
              };
              window.typesetMath();   // typeset the initial render
            }
            post({ type: "artifact:ready", title: title });
            reportHeight();
            if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.documentElement);
            else window.addEventListener("resize", reportHeight);
          });
        } catch (err) { showError((err && err.message) || err); }
      }

      window.addEventListener("message", function (e) {
        var d = e.data || {};
        if (d.source !== "note") return;
        if (d.type === "artifact:init") { frameId = d.id; mount(d); }
        else if (d.type === "artifact:theme") { applyTheme(d.theme); reportHeight(); }
      });

      parent.postMessage({ source: "artifact", type: "artifact:hostready" }, "*");
    })();
  </script>
</body>
</html>
